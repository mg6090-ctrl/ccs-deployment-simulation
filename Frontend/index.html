<!DOCTYPE html>
<html>
    <head>
        <title>CCS Deployment Simulation</title>
        <script src = "https://cdn.plot.ly/plotly-3.6.0.min.js" charset="utf-8"></script>
    </head>
    <body>
        
        <div id = "scenario_selection">
            <h3>World Selection</h3>
            <label> World 1.1: Incentive Rush </label>
            <input id = "w1_1_checked" type = "checkbox"></input>
            <br>
            <label> World 2: Uncoordinated </label>
            <input id = "w2_checked" type = "checkbox"></input>
        </div>

        <br>

        <div id = "w1_1_params">
            <h3>World 1.1 (Incentive Rush) Parameters</h3>
            <label> W1.1 stochastic lognormal duration sampling </label>
            <input id = "w1_1_sampling" type = "checkbox"></input>
            <br>
            <label> W1.1 base rate </label>
            <input id = "w1_1_base_rate" type = "number" value = "0.05"></input>
            <label> W1.1 max rate </label>
            <input id = "w1_1_max_rate" type = "number" value = "0.4"></input>
            <br>
            <label> W1.1 risk-tolerant fraction </label>
            <input id = "w1_1_frac_split_approval" type = "number" value = "0.2"></input>
            <br>
            <label> W1.1 capture tolerance </label>
            <input id = "w1_1_cap_tol" type = "number" min = "0.001" value = "48"></input>
            <br>
            <label> W1.1 number of trials </label>
            <input id = "w1_1_n_reps" type = "number" value = "100"></input>
        </div>

        <br>

        <div id = "w2_params">
            <h3>World 2 Parameters</h3>
            <label> W2 stochastic lognormal duration sampling </label>
            <input id = "w2_sampling" type = "checkbox"></input>
            <br>
            <label> S2 base rate </label>
            <input id = "w2_base_rate" type = "number" value = "0.05"></input>
            <label> S2 max rate </label>
            <input id = "w2_max_rate" type = "number" value = "0.4"></input>
            <br>
            <label> S2 threshold fraction </label>
            <input id = "w2_threshold_frac" type = "number" value = "0.5"></input>
            <br>
            <label> S2 capture tolerance </label>
            <input id = "w2_cap_tol" type = "number" min = "0.001" value = "36"></input>
            <label> S2 transport tolerance </label>
            <input id = "w2_trans_tol" type = "number" min = "0.001" value = "36"></input>
            <label> S2 storage tolerance </label>
            <input id = "w2_stor_tol" type = "number" min = "0.001" value = "36"></input>
            <br>
            <label> S2 number of trials </label>
            <input id = "w2_n_reps" type = "number" value = "100"></input>
        </div>

        <br>
        <br>
        <button id = "run">Run Simulation</button>
    
        <h3>Scenario Comparisons</h3>
        <div style = "display: flex; gap: 18px; width: 100%">
            <div style = "flex: 1; min-width: 0;">
                <div id = "chart_c_abandon" style = "height: 400px;"></div>
            </div>
            <div style = "flex: 1; min-width: 0;">
                <div id = "chart_final_vol" style = "height: 400px;"></div>
            </div>
            <div style = "flex: 1; min-width: 0;">
                <div id = "chart_time" style = "height: 400px;"></div>
            </div>
        </div>
        

        <div style = "display: flex; gap: 24px;">
            <div style = "flex: 1;">
                <h3>Scenario 1 Results</h3>
                <pre id = "s1_output"></pre>
            </div>

            <div style = "flex: 2;">
                <h3>Scenario 2 Results</h3>
                <pre id = "s2_output"></pre>
            </div>
        </div>

        <pre id = "output"></pre>

        <script>
            // getting the html elements via their id 
            const button = document.getElementById('run')
            const output = document.getElementById('output')
            
            // adding async function to the button
            button.addEventListener('click', async () => {
                // creating the scenarios list
                const scenarios = []
                if (document.getElementById('w1_1_checked').checked){
                    scenarios.push("world1_1")
                }
                if (document.getElementById('w2_checked').checked){
                    scenarios.push("world2")
                }
                
                // filling scenario1 params
                const scenario1 = {}
                scenario1["base_rate"] = Number(document.getElementById('w1_1_base_rate').value)
                scenario1["n_reps"] = parseInt(document.getElementById('w1_1_n_reps').value)
                scenario1["sampling"] = document.getElementById('w1_1_sampling').checked
                scenario1["w1_1_max_rate"] = Number(document.getElementById('w1_1_max_rate').value)
                scenario1["w1_1_cap_tol"] = Number(document.getElementById('w1_1_cap_tol').value)
                scenario1["frac_split_app"] = Number(document.getElementById('w1_1_frac_split_approval').value)
                
                // filling scenario2 params
                const scenario2 = {}
                scenario2["base_rate"] = Number(document.getElementById('w2_base_rate').value)
                scenario2["n_reps"] = parseInt(document.getElementById('w2_n_reps').value)
                scenario2["sampling"] = document.getElementById('w2_sampling').checked
                scenario2["max_rate"] = Number(document.getElementById('w2_max_rate').value)
                scenario2["threshold_frac"] = Number(document.getElementById('w2_threshold_frac').value)
                scenario2["cap_tol"] = Number(document.getElementById('w2_cap_tol').value)
                scenario2["trans_tol"] = Number(document.getElementById('w2_trans_tol').value)
                scenario2["stor_tol"] = Number(document.getElementById('w2_stor_tol').value)

                const response = await fetch(
                    "http://localhost:5000/api/run-model", 
                    {
                        method: 'POST', 
                        headers: {"Content-Type": "application/json"}, 
                        body: JSON.stringify({"scenarios": scenarios, "world1_1": scenario1, "world2": scenario2})
                    }
                )
                const data = await response.json()
                
                x_c_abandon = []
                y_c_abandon = []

                x_c_final_vol = []
                y_c_final_vol = []

                x_c_time = []
                y_c_time = []

                if (data.scenario1){
                    const s1_summary = data.scenario1.summary
                    const s1_reps = data.scenario1.reps
                    s1_output.textContent = JSON.stringify(s1_summary, null, 2)

                    x_c_abandon.push("Scenario 1")
                    y_c_abandon.push(data.scenario1.summary["average capture abandonment rate"])

                    x_c_final_vol.push("Scenario 1")
                    y_c_final_vol.push(data.scenario1.summary["average final volume"])

                    x_c_time.push("Scenario 1")
                    y_c_time.push(data.scenario1.summary["average completion time"])
                }

                if (data.scenario2){
                    const s2_summary = data.scenario2.summary
                    const s2_reps = data.scenario2.reps
                    s2_output.textContent = JSON.stringify(s2_summary, null, 2)

                    x_c_abandon.push("Scenario 2")
                    y_c_abandon.push(data.scenario2.summary["average capture abandonment rate"])

                    x_c_final_vol.push("Scenario 2")
                    y_c_final_vol.push(data.scenario2.summary["average final vol of capture"])

                    x_c_time.push("Scenario 2")
                    y_c_time.push(data.scenario2.summary["average completion time of survived"])
                }

                Plotly.newPlot(
                    "chart_c_abandon", 
                    [{x: x_c_abandon, y: y_c_abandon, type: "bar"}],
                    {title: {text: "Average capture project abandonment rate"}}
                )

                Plotly.newPlot(
                    "chart_final_vol",
                    [{x: x_c_final_vol, y: y_c_final_vol, type: "bar"}],
                    {title: {text: "Average final volume captured"}}
                )

                Plotly.newPlot(
                    "chart_time",
                    [{x: x_c_time, y:y_c_time, type: "bar"}],
                    {title: {text: "Average completion time of survived clusters"}}
                )
            })
            
        </script>

    </body>
</html>
