<!DOCTYPE html>
<html>
    <head>
        <title>CCS Deployment Simulation</title>
        <script src="https://cdn.plot.ly/plotly-3.6.0.min.js" charset="utf-8"></script>
        <style>
            :root {
                --bg-color: #f8f9fa;
                --card-bg: #ffffff;
                --text-color: #212529;
                --accent-color: #0d6efd;
                --accent-hover: #0b5ed7;
                --border-color: #dee2e6;
            }

            body {
                padding: 40px;
                max-width: 1400px;
                margin: 0 auto;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg-color);
                color: var(--text-color);
                line-height: 1.5;
            }

            h1 {
                color: #1a1d20;
                font-weight: 700;
                text-align: center;
                margin-bottom: 30px;
            }

            h3 {
                margin-top: 0;
                margin-bottom: 15px;
                color: #343a40;
                border-bottom: 2px solid var(--bg-color);
                padding-bottom: 8px;
            }

            /* Container layout for side-by-side configurations */
            .config-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                gap: 20px;
                margin-bottom: 25px;
            }

            .card {
                background: var(--card-bg);
                padding: 24px;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.04);
                border: 1px solid var(--border-color);
            }

            /* Clean Form Alignment formatting */
            .form-group {
                margin-bottom: 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .form-group label {
                font-size: 14px;
                color: #495057;
                flex: 1;
            }

            .form-group input[type="number"] {
                padding: 6px 10px;
                border-radius: 4px;
                border: 1px solid var(--border-color);
                width: 75px;
                text-align: right;
            }

            .form-group input[type="checkbox"] {
                width: 18px;
                height: 18px;
                cursor: pointer;
            }

            /* Modernized Submit Button */
            #run {
                background-color: var(--accent-color);
                color: white;
                border: none;
                padding: 14px 28px;
                font-size: 16px;
                font-weight: 600;
                border-radius: 6px;
                cursor: pointer;
                transition: background 0.2s ease, transform 0.1s ease;
                display: block;
                width: 220px;
                margin: 30px auto;
                box-shadow: 0 4px 6px rgba(13, 110, 253, 0.15);
            }

            #run:hover {
                background-color: var(--accent-hover);
            }

            #run:active {
                transform: scale(0.98);
            }

            /* Flexible Chart Rows */
            .chart-row, .results-row {
                display: flex;
                gap: 20px;
                width: 100%;
                margin-top: 25px;
            }

            .chart-col, .results-col {
                flex: 1;
                min-width: 0;
            }

            /* Developer style console logs for data displays */
            pre {
                background-color: #212529;
                color: #f8f9fa;
                padding: 16px;
                border-radius: 6px;
                font-size: 13px;
                border: 1px solid #343a40;
                overflow-x: auto;
                white-space: pre-wrap;
                word-break: break-all;
                font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                max-height: 400px;
            }
        </style>
    </head>
    <body>
        
        <h1>CCS Deployment Simulation Dashboard</h1>

        <div class="config-grid">
            <div class="card" id="scenario_selection">
                <h3>World Selection</h3>
                <div class="form-group">
                    <label for="w1_1_checked">World 1.1: Incentive Rush</label>
                    <input id="w1_1_checked" type="checkbox" checked></input>
                </div>
                <div class="form-group">
                    <label for="w1_2_checked">World 1.2: Infrastructure Build-Out</label>
                    <input id="w1_2_checked" type="checkbox" checked></input>
                </div>
                <div class="form-group">
                    <label for="w2_checked">World 2: Uncoordinated</label>
                    <input id="w2_checked" type="checkbox" checked></input>
                </div>
            </div>

            <div class="card" id="w1_1_params">
                <h3>World 1.1 Parameters</h3>
                <div class="form-group">
                    <label>Lognormal duration sampling</label>
                    <input id="w1_1_sampling" type="radio" name="w1_1_distribution_selection" checked></input>
                </div>
                <div class="form-group">
                    <label>Normal duration sampling</label>
                    <input id="w1_1_norm_sampling" type="radio" name="w1_1_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>Uniform duration sampling</label>
                    <input id="w1_1_uni_sampling" type="radio" name="w1_1_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>No duration sampling</label>
                    <input id="w1_1_no_sampling" type="radio" name="w1_1_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>Base rate</label>
                    <input id="w1_1_base_rate" type="number" step="0.01" value="0.05"></input>
                </div>
                <div class="form-group">
                    <label>Max rate</label>
                    <input id="w1_1_max_rate" type="number" step="0.1" value="0.4"></input>
                </div>
                <div class="form-group">
                    <label>Risk-tolerant fraction</label>
                    <input id="w1_1_frac_split_approval" type="number" step="0.1" value="0.2"></input>
                </div>
                <div class="form-group">
                    <label>Capture tolerance (months)</label>
                    <input id="w1_1_cap_tol" type="number" min="0.001" value="48"></input>
                </div>
                <div class="form-group">
                    <label>Number of trials</label>
                    <input id="w1_1_n_reps" type="number" value="300"></input>
                </div>
            </div>

            <div class="card" id="w1_2_params">
                <h3>World 1.2 Parameters</h3>
                <div class="form-group">
                    <label>Lognormal duration sampling</label>
                    <input id="w1_2_sampling" type="radio" name="w1_2_distribution_selection" checked></input>
                </div>
                <div class="form-group">
                    <label>Normal duration sampling</label>
                    <input id="w1_2_norm_sampling" type="radio" name="w1_2_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>Uniform duration sampling</label>
                    <input id="w1_2_uni_sampling" type="radio" name="w1_2_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>No duration sampling</label>
                    <input id="w1_2_no_sampling" type="radio" name="w1_2_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>Base rate</label>
                    <input id="w1_2_base_rate" type="number" step="0.01" value="0.05"></input>
                </div>
                <div class="form-group">
                    <label>Max rate</label>
                    <input id="w1_2_max_rate" type="number" step="0.1" value="0.4"></input>
                </div>
                <div class="form-group">
                    <label>Risk-tolerant fraction</label>
                    <input id="w1_2_frac_split_approval" type="number" step="0.1" value="0.2"></input>
                </div>
                <div class="form-group">
                    <label>Capture tolerance (months)</label>
                    <input id="w1_2_cap_tol" type="number" min="0.001" value="48"></input>
                </div>
                <div class="form-group">
                    <label>Infrastructure threshold</label>
                    <input id="w1_2_n_hammock_threshold" type="number" step="0.1" value="0.2"></input>
                </div>
                <div class="form-group">
                    <label>Number of trials</label>
                    <input id="w1_2_n_reps" type="number" value="300"></input>
                </div>
            </div>

            <div class="card" id="w2_params">
                <h3>World 2 Parameters</h3>
                <div class="form-group">
                    <label>Lognormal duration sampling</label>
                    <input id="w2_sampling" type="radio" name="w2_distribution_selection" checked></input>
                </div>
                <div class="form-group">
                    <label>Normal duration sampling</label>
                    <input id="w2_norm_sampling" type="radio" name="w2_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>Uniform duration sampling</label>
                    <input id="w2_uni_sampling" type="radio" name="w2_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>No duration sampling</label>
                    <input id="w2_no_sampling" type="radio" name="w2_distribution_selection" unchecked></input>
                </div>
                <div class="form-group">
                    <label>Base rate</label>
                    <input id="w2_base_rate" type="number" step="0.01" value="0.05"></input>
                </div>
                <div class="form-group">
                    <label>Max rate</label>
                    <input id="w2_max_rate" type="number" step="0.1" value="0.4"></input>
                </div>
                <div class="form-group">
                    <label>Threshold fraction</label>
                    <input id="w2_threshold_frac" type="number" step="0.1" value="0.5"></input>
                </div>
                <div class="form-group">
                    <label>Late penalty</label>
                    <input id="w2_late_penalty" type="number" step="0.1" value="0.4"></input>
                </div>
                <div class="form-group">
                    <label>Capture tolerance</label>
                    <input id="w2_cap_tol" type="number" min="0.001" value="36"></input>
                </div>
                <div class="form-group">
                    <label>Transport tolerance</label>
                    <input id="w2_trans_tol" type="number" min="0.001" value="36"></input>
                </div>
                <div class="form-group">
                    <label>Storage tolerance</label>
                    <input id="w2_stor_tol" type="number" min="0.001" value="36"></input>
                </div>
                <div class="form-group">
                    <label>Number of trials</label>
                    <input id="w2_n_reps" type="number" value="300"></input>
                </div>
            </div>
        </div>

        <button id="run">Run Simulation</button>
    
        <h2 style="margin-top: 40px; font-weight:700;">Scenario Comparisons</h2>
        <div class="chart-row">
            <div class="chart-col">
                <div id="chart_c_abandon" class="card" style="height: 400px; padding: 10px;"></div>
            </div>
            <div class="chart-col">
                <div id="chart_final_vol" class="card" style="height: 400px; padding: 10px;"></div>
            </div>
            <div class="chart-col">
                <div id="chart_time" class="card" style="height: 400px; padding: 10px;"></div>
            </div>
        </div>
        
        <h2 style="margin-top: 40px; font-weight:700;">Detailed Run Metrics</h2>
        <div class="results-row">
            <div class="results-col">
                <div class="card" style="height: 100%;">
                    <h3>World 1.1 Results</h3>
                    <pre id="w1_1_output">Awaiting run...</pre>
                </div>
            </div>

            <div class="results-col">
                <div class="card" style="height: 100%;">
                    <h3>World 1.2 Results</h3>
                    <pre id="w1_2_output">Awaiting run...</pre>
                </div>
            </div>

            <div class="results-col">
                <div class="card" style="height: 100%;">
                    <h3>World 2 Results</h3>
                    <pre id="s2_output">Awaiting run...</pre>
                </div>
            </div>
        </div>

        <pre id="output" style="display:none;"></pre>

        <script>
            const button = document.getElementById('run')
            const w1_1_output = document.getElementById('w1_1_output')
            const w1_2_output = document.getElementById('w1_2_output')
            const s2_output = document.getElementById('s2_output')
            
            // Plotly layout defaults for transparent cards
            const chartLayoutDefaults = {
                paper_bgcolor: 'rgba(0,0,0,0)',
                plot_bgcolor: 'rgba(0,0,0,0)',
                margin: { t: 50, b: 40, l: 50, r: 15 },
                font: { family: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' }
            };

            // Helper function to turn keys into clean UI labels and format values
            function formatMetrics(summaryObj) {
                if (!summaryObj) return "No data available.";
                const customLabels = {
                    "average capture abandonment rate": "Capture Abandon Rate",
                    "average final vol of capture": "Final Vol Captured",
                    "average completion time of survived": "Completion Time",
                    "avg percent of capture abandoning at approval": "Capture Abandon @ Approval",
                    "avg percent of transport abandoning at approval": "Transport Abandon @ Approval"
                };

                let html = '<ul style="list-style: none; padding: 0; margin: 0;">';
                
                for (const [key, value] of Object.entries(summaryObj)) {
                    // 1. Clean up the key string (Capitalize words, remove "average" or "avg")
                    let label = customLabels[key.toLowerCase().trim()] || key
                        .replace(/^(average|avg)\s+/i, '') // removes "average " or "avg " from start
                        .replace(/_/g, ' ')                // switches underscores to spaces
                        .replace(/\b\w/g, c => c.toUpperCase()); // Capitalizes Words

                    // 2. Smart value formatting
                    let displayValue = value;
                    if (typeof value === 'number') {
                        if (key.includes('rate') || key.includes('percent')) {
                            // Format decimals as percentages (e.g., 0.1425 -> 14.3%)
                            displayValue = `${(value * 100).toFixed(1)}%`;
                        } else {
                            // Standard numbers rounded to 2 decimal places
                            displayValue = value.toFixed(2);
                        }
                    }

                    html += `
                        <li style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #343a40; font-size: 14px;">
                            <span style="color: #adb5bd; font-weight: 500;">${label}:</span>
                            <span style="color: #ffffff; font-weight: 600; font-family: monospace;">${displayValue}</span>
                        </li>`;
                }
                html += '</ul>';
                return html;
            }

            button.addEventListener('click', async () => {
                button.textContent = "Processing...";
                button.disabled = true;

                const scenarios = []
                if (document.getElementById('w1_1_checked').checked){ scenarios.push("world1_1") }
                if (document.getElementById('w1_2_checked').checked){ scenarios.push("world1_2") }
                if (document.getElementById('w2_checked').checked){ scenarios.push("world2") }
                
                const world1_1 = {
                    base_rate: Number(document.getElementById('w1_1_base_rate').value),
                    n_reps: parseInt(document.getElementById('w1_1_n_reps').value),
                    sampling: document.getElementById('w1_1_sampling').checked,
                    norm_sampling: document.getElementById('w1_1_norm_sampling').checked,
                    uni_sampling: document.getElementById('w1_1_uni_sampling').checked,
                    s1_max_rate: Number(document.getElementById('w1_1_max_rate').value),
                    s1_cap_tol: Number(document.getElementById('w1_1_cap_tol').value),
                    frac_split_app: Number(document.getElementById('w1_1_frac_split_approval').value)
                }
                
                const world1_2 = {
                    base_rate: Number(document.getElementById('w1_2_base_rate').value),
                    n_reps: parseInt(document.getElementById('w1_2_n_reps').value),
                    sampling: document.getElementById('w1_2_sampling').checked,
                    norm_sampling: document.getElementById('w1_2_norm_sampling').checked,
                    uni_sampling: document.getElementById('w1_2_uni_sampling').checked,
                    s1_max_rate: Number(document.getElementById('w1_2_max_rate').value),
                    s1_cap_tol: Number(document.getElementById('w1_2_cap_tol').value),
                    frac_split_app: Number(document.getElementById('w1_2_frac_split_approval').value),
                    hammock_threshold: Number(document.getElementById('w1_2_n_hammock_threshold').value)
                }

                const world2 = {
                    base_rate: Number(document.getElementById('w2_base_rate').value),
                    n_reps: parseInt(document.getElementById('w2_n_reps').value),
                    sampling: document.getElementById('w2_sampling').checked,
                    norm_sampling: document.getElementById('w2_norm_sampling').checked,
                    uni_sampling: document.getElementById('w2_uni_sampling').checked,
                    no_sampling: document.getElementById('w2_no_sampling').checked,
                    max_rate: Number(document.getElementById('w2_max_rate').value),
                    threshold_frac: Number(document.getElementById('w2_threshold_frac').value),
                    cap_tol: Number(document.getElementById('w2_cap_tol').value),
                    trans_tol: Number(document.getElementById('w2_trans_tol').value),
                    stor_tol: Number(document.getElementById('w2_stor_tol').value),
                    late_penalty: Number(document.getElementById('w2_late_penalty').value)
                }

                try {
                    const response = await fetch(
                        "http://localhost:5000/api/run-model", 
                        {
                            method: 'POST', 
                            headers: {"Content-Type": "application/json"}, 
                            body: JSON.stringify({"scenarios": scenarios, "world1_1": world1_1, "world1_2": world1_2, "world2": world2})
                        }
                    )
                    const data = await response.json()
                    
                    const x_c_abandon = [], y_c_abandon = []
                    const x_c_final_vol = [], y_c_final_vol = []
                    const x_c_time = [], y_c_time = []

                    if (data.world1_1){
                        const w1_1_summary = data.world1_1.summary
                        w1_1_output.innerHTML = formatMetrics(w1_1_summary); // Updated

                        x_c_abandon.push("World 1.1")
                        y_c_abandon.push(w1_1_summary["average capture abandonment rate"])
                        x_c_final_vol.push("World 1.1")
                        y_c_final_vol.push(w1_1_summary["average final volume"])
                        x_c_time.push("World 1.1")
                        y_c_time.push(w1_1_summary["average completion time"])
                    } else { w1_1_output.innerHTML = '<span style="color:#6c757d">Not selected.</span>'; }

                    if (data.world1_2){
                        const w1_2_summary = data.world1_2.summary
                        w1_2_output.innerHTML = formatMetrics(w1_2_summary); // Updated

                        x_c_abandon.push("World 1.2")
                        y_c_abandon.push(w1_2_summary["average capture abandonment rate"])
                        x_c_final_vol.push("World 1.2")
                        y_c_final_vol.push(w1_2_summary["average final volume"])
                        x_c_time.push("World 1.2")
                        y_c_time.push(w1_2_summary["average completion time"])
                    } else { w1_2_output.innerHTML = '<span style="color:#6c757d">Not selected.</span>'; }

                    if (data.world2){
                        const w2_summary = data.world2.summary
                        s2_output.innerHTML = formatMetrics(w2_summary); // Updated

                        x_c_abandon.push("World 2")
                        y_c_abandon.push(w2_summary["average capture abandonment rate"])
                        x_c_final_vol.push("World 2")
                        y_c_final_vol.push(w2_summary["average final vol of capture"])
                        x_c_time.push("World 2")
                        y_c_time.push(w2_summary["average completion time of survived"])
                    } else { s2_output.innerHTML = '<span style="color:#6c757d">Not selected.</span>'; }

                    // Rendering Charts
                    Plotly.newPlot("chart_c_abandon", 
                        [{x: x_c_abandon, y: y_c_abandon, type: "bar", marker: {color: '#dc3545'}}],
                        { title: {text: "<b>Capture Project Abandonment Rate</b>"}, ...chartLayoutDefaults }
                    )

                    Plotly.newPlot("chart_final_vol",
                        [{x: x_c_final_vol, y: y_c_final_vol, type: "bar", marker: {color: '#198754'}}],
                        { title: {text: "<b>Avg Final Volume Captured (Completion)</b>"}, ...chartLayoutDefaults }
                    )

                    Plotly.newPlot("chart_time",
                        [{x: x_c_time, y:y_c_time, type: "bar", marker: {color: '#0d6efd'}}],
                        { title: {text: "<b>Avg Completion Time (Survived)</b>"}, ...chartLayoutDefaults }
                    )
                } catch (err) {
                    alert("Failed to reach simulation API. Make sure your Python Flask app is running!");
                    console.error(err);
                } finally {
                    button.textContent = "Run Simulation";
                    button.disabled = false;
                }
            })
        </script>
    </body>
</html>
