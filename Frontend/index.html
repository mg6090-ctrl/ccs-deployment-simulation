<!DOCTYPE html>
<html>
    <head>
        <title>
            CCS Model
        </title>
    </head>
    <body>

        <text> Sampling </text>
        <input id = "sampling" type = "boolean" value = "True"></input>

        <text> Base Rate </text>
        <input id = "base_rate" type = "number" value = "0.1"></input>
        
        <text> Number of trials </text>
        <input id = "n_reps" type = "number" value = "100"></input>

        <br>

        <!-- <text> Risk tolerance split (tolerant, averse) </text>
        <input id = "frac_split" type = "string" value = "(0.2, 0.8)"></input> -->

        <text> Replication seed </text>
        <input id = "replication_seed" type = "number" value = "0"></input>

        <br>
        <br>

        <button id = "run">Run model</button>
        <pre id = "output"></pre>

        <script>
            
            // getting the html elements via their id 
            const button = document.getElementById('run')
            const output = document.getElementById('output')
            
            // adding async function to the button
            button.addEventListener('click', async () => {
                const base_rate = Number(document.getElementById('base_rate').value)
                const n_reps = parseInt(document.getElementById('n_reps').value)
                const sampling = Boolean(document.getElementById('sampling').value)
                const replication_seed = Number(document.getElementById('replication_seed').value)
                // const frac_split = String(document.getElementById('frac_split').value)

                const response = await fetch(
                    "http://localhost:5000/api/run-s1", 
                    {
                        method: 'POST', 
                        headers: {"Content-Type": "application/json"}, 
                        body: JSON.stringify({n_reps, base_rate, replication_seed, sampling})
                    }
                )
                const data = await response.json()
                output.textContent = JSON.stringify(data, null, 2)
            })
            
        </script>

    </body>
</html>
