<!DOCTYPE html>
<html>
    <head>
        <title>
            CCS Model
        </title>
    </head>
    <body>

        <label> Stochastic duration sampling </label>
        <input id = "sampling" type = "checkbox"></input>

        <br>
        <br>

        <label> Base Rate </label>
        <input id = "base_rate" type = "number" value = "0.1"></input>
        
        <br>

        <label> Number of trials </label>
        <input id = "n_reps" type = "number" value = "5"></input>

        <br>
        <br>

        <button id = "run">Run model</button>
        <pre id = "output"></pre>

        <script>
            
            // getting the html elements via their id 
            const button = document.getElementById('run')
            const output = document.getElementById('output')
            
            // adding async function to the button
            button.addEventListener('click', async () => {
                const base_rate = Number(document.getElementById('base_rate').value)
                const n_reps = parseInt(document.getElementById('n_reps').value)
                const sampling = document.getElementById('sampling').checked

                const response = await fetch(
                    "http://localhost:5000/api/run-s1", 
                    {
                        method: 'POST', 
                        headers: {"Content-Type": "application/json"}, 
                        body: JSON.stringify({n_reps, base_rate, sampling})
                    }
                )
                const data = await response.json()
                output.textContent = JSON.stringify(data, null, 2)
            })
            
        </script>

    </body>
</html>
